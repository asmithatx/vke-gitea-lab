---
# Stage 0: OS prep on every node. Nothing Kubernetes-specific is running yet.
# Proof: `kubeadm version`, `containerd --version`, swap off, modules loaded.
- name: Prepare all nodes for kubeadm
  hosts: k8s
  become: true
  tasks:
    - name: Disable swap now
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable swap in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Load kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: [overlay, br_netfilter]

    - name: Persist kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Kernel sysctls for Kubernetes networking
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
        - net.ipv4.ip_forward

    - name: Install prerequisites
      ansible.builtin.apt:
        name: [apt-transport-https, ca-certificates, curl, gpg, containerd]
        state: present
        update_cache: true

    - name: Generate default containerd config
      ansible.builtin.shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    # kubelet uses the systemd cgroup driver; containerd must match or pods
    # crash-loop with cryptic errors. Classic self-managed gotcha.
    - name: Use systemd cgroup driver in containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: restart containerd

    - name: Add Kubernetes apt signing key
      ansible.builtin.shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key \
          | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repo
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Install kubeadm, kubelet, kubectl
      ansible.builtin.apt:
        name:
          - "kubelet={{ k8s_version }}-*"
          - "kubeadm={{ k8s_version }}-*"
          - "kubectl={{ k8s_version }}-*"
        state: present
        update_cache: true

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]

    # --cloud-provider=external is what makes a node wait for the CCM.
    # Until the CCM initializes it, the node carries the taint
    # node.cloudprovider.kubernetes.io/uninitialized=true:NoSchedule
    # and nothing (not even Calico) schedules. That taint is proof stage 3.
    - name: Set kubelet cloud-provider=external
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        content: 'KUBELET_EXTRA_ARGS="--cloud-provider=external --node-ip={{ private_ip }}"'
      notify: restart kubelet

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

  handlers:
    - name: restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
    - name: restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
