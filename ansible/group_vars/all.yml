# Pin to the same minor as the VKE cluster so the comparison is apples-to-apples.
k8s_minor: "1.31"
k8s_version: "1.31.0"
containerd_version: "latest"

pod_cidr: "192.168.0.0/16"       # Calico default
service_cidr: "10.96.0.0/12"
calico_version: "v3.28.2"

# Vultr integrations — both read VULTR_API_KEY from the environment at runtime.
vultr_ccm_chart_version: "1.3.0"
vultr_csi_manifest_url: "https://raw.githubusercontent.com/vultr/vultr-csi/master/docs/releases/latest.yml"

# Gitea / monitoring — same pins as terraform/vke
gitea_chart_version: "11.0.1"
gitea_domain: "git-kubeadm.lab.example.com"
kps_chart_version: "65.1.1"

# Where the shared values live, relative to the ansible/ directory
repo_root: "{{ playbook_dir }}/.."
